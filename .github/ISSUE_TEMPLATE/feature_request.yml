name: Feature request
description: Suggest an idea or an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you would like it to work. Rough is fine.
  - type: textarea
    id: privacy
    attributes:
      label: Privacy
      description: Does this change what is collected, uploaded or shown? If so, how should it stay private?

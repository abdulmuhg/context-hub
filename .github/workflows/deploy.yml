name: Deploy

# Every commit to main deploys. Enabled after a manual dispatch went green
# against a provisioned server; workflow_dispatch is kept for redeploying an
# unchanged tree and for rollback testing.
#
# Not vps-stack's shared deploy-app.yml: this repo is public and vps-stack is
# private, and GitHub lets only private repos call a private repo's reusable
# workflows. The steps below mirror it, including verify.sh at the end.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two deploys racing would leave IMAGE_TAG and the running container
# disagreeing. Queue instead of cancelling.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    # Forks inherit this workflow but have no server or secrets: deploy only from the owner's repository.
    if: github.repository == 'abdulmuhg/context-hub'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        run: |
          echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "version=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The Dockerfile runs the typecheck and the whole test suite before
      # bundling. That is the correctness gate; there is no separate test job.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            HUB_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Plain ssh (preinstalled on the runner), as in vps-stack's deploy-app.yml:
      # appleboy/ssh-action downloads its binary from GitHub releases on every
      # run, and release downloads returning 504 blocked deploys on 2026-11-08.
      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 \
            "$SSH_USER@$SSH_HOST" bash -s -- "$TAG" <<'REMOTE'
          set -euo pipefail
          tag="$1"
          cd /opt/stack/context-hub
          # Rewrite the pinned tag, then pull. Rollback is the same edit
          # with an older SHA.
          sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${tag}|" .env
          grep '^IMAGE_TAG=' .env
          docker compose pull
          docker compose up -d
          docker image prune -f
          # Fails the job unless the container is healthy, runs this tag and
          # answers through Caddy (vps-stack's scripts/verify.sh).
          /opt/stack/scripts/verify.sh context-hub
          REMOTE

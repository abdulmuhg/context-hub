name: Deploy

# Every commit to main deploys; workflow_dispatch is kept for redeploying an
# unchanged tree and for rollback testing.
#
# The steps live in vps-stack's shared workflow (build, push to GHCR as
# sha-<12 hex>, set IMAGE_TAG over SSH, restart, then scripts/verify.sh), so a
# green run means the hub answers through Caddy. Needs the SSH_HOST, SSH_USER
# and SSH_KEY secrets in this repo; `secrets: inherit` passes them on.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A reusable workflow can only use the permissions its caller grants.
permissions:
  contents: read
  packages: write

jobs:
  # The collector's version string (`hub --version`): the UTC build date plus
  # the short commit. Computed here because the shared workflow only knows
  # GIT_SHA; it goes in as an extra build arg.
  version:
    # Forks inherit this workflow but have no server or secrets.
    if: github.repository == 'abdulmuhg/context-hub'
    runs-on: ubuntu-latest
    outputs:
      hub: ${{ steps.v.outputs.hub }}
    steps:
      - id: v
        run: echo "hub=$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  deploy:
    needs: version
    uses: abdulmuhg/vps-stack/.github/workflows/deploy-app.yml@main
    with:
      app: context-hub
      build-args: HUB_VERSION=${{ needs.version.outputs.hub }}
    secrets: inherit

# A complete single-server context-hub: the hub and Caddy for HTTPS.
# See deploy/README.md. Put this file and the Caddyfile on the server, set
# HUB_DOMAIN in .env, then: docker compose up -d
services:
  context-hub:
    # The default is the public image. Set HUB_IMAGE in .env to pin a tag on a
    # server you care about.
    image: ${HUB_IMAGE:-ghcr.io/abdulmuhg/context-hub:latest}
    restart: unless-stopped
    # Not published to the host: only Caddy reaches it.
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      PORT: "3000"
      DATABASE_PATH: /data/hub.sqlite
      PUBLIC_URL: https://${HUB_DOMAIN:?set HUB_DOMAIN in .env, for example HUB_DOMAIN=hub.example.com}
    volumes:
      # The hub's only state: one SQLite file. Back it up with backup.sh.
      - hub_data:/data
      # Read-only, and only the status folder: backup.sh writes one JSON file
      # here about its last run, which the dashboard shows.
      - ./backups/status:/backup-status:ro
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - context-hub

volumes:
  hub_data:
  caddy_data:
  caddy_config:
